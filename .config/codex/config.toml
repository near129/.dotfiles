#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-6.2-sol"
model_verbosity = "high"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
hide_agent_reasoning = false
model_reasoning_effort = "medium"
allow_login_shell = true
sandbox_mode = "workspace-write"
web_search = "live"

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "~/.cache",
  "~/.local/state",
  "~/.npm",
  "~/.local/share/pnpm/store",
  "~/Library/pnpm/store",
  "~/Library/Caches/pnpm",
  "~/Library/Caches/Yarn",
  "~/Library/Caches/pip",
  "~/Library/Caches/Homebrew",
  "~/Library/Caches/go-build",
  "~/go/pkg/mod",
  "~/.cargo/registry",
  "~/.cargo/git",
  "~/.cargo/.package-cache",
  "~/.cargo/.package-cache-mutate",
  "~/.cargo/.global-cache",
  "~/.cargo/.global-cache-shm",
  "~/.cargo/.global-cache-wal",
]

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"api.github.com" = "allow"
"cache.nixos.org" = "allow"
"codeload.github.com" = "allow"
"crates.io" = "allow"
"files.pythonhosted.org" = "allow"
"formulae.brew.sh" = "allow"
"ghcr.io" = "allow"
"github.com" = "allow"
"index.crates.io" = "allow"
"nodejs.org" = "allow"
"objects.githubusercontent.com" = "allow"
"pkg-containers.githubusercontent.com" = "allow"
"proxy.golang.org" = "allow"
"pypi.org" = "allow"
"raw.githubusercontent.com" = "allow"
"registry.npmjs.org" = "allow"
"registry.yarnpkg.com" = "allow"
"release-assets.githubusercontent.com" = "allow"
"releases.astral.sh" = "allow"
"releases.nixos.org" = "allow"
"static.crates.io" = "allow"
"static.rust-lang.org" = "allow"
"sum.golang.org" = "allow"
